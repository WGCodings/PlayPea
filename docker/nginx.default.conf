# PlayPea static site. TLS and the public hostname are handled by Caddy in
# front of this container (see README), so this only listens on plain HTTP.
server {
	listen 80;
	listen [::]:80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/plain text/css application/json application/javascript application/wasm text/xml image/svg+xml;
	gzip_comp_level 6;
	gzip_min_length 256;
	gzip_vary on;

	# Next.js static export: /play -> /play.html
	location / {
		try_files $uri $uri.html $uri/ =404;
	}

	# Hashed build assets never change.
	location /_next/static/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Engine builds: one file per Pea version. Cached for a week so a rebuilt
	# engine still reaches visitors reasonably fast.
	location /engines/ {
		types {
			application/wasm wasm;
			application/javascript js;
		}
		add_header Cache-Control "public, max-age=604800";
	}

	location ~* \.(png|svg|ico|mp3|ttf|woff2?)$ {
		add_header Cache-Control "public, max-age=604800";
	}

	error_page 404 /404.html;
}
